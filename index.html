<!-- PapaParse CSV Logic with Excel-Like Dropdown Filters -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        Papa.parse("FINAL_Words.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            transformHeader: function(header) { return header.trim(); },
            complete: function(results) {
                const data = results.data;
                const tbody = document.getElementById("tableBody");
                tbody.innerHTML = "";

                let vMeaningCount = 0;

                data.forEach(row => {
                    // Filter to only load V1 and V2 words
                    if (row.WWT_WORD && (row.AI_CLASSIFICATION === "V1" || row.AI_CLASSIFICATION === "V2")) {
                        vMeaningCount++;
                        
                        const aoaValue = row['AoAtestbased_Brysbaert_&_Biemiller_2017'] || row['AoAtestbased_B_&_B_2017'] || "";
                        
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td><strong>${row.WWT_WORD}</strong></td>
                            <td>${row.WWT_MEANING || ""}</td>
                            <td><strong>${row.AI_CLASSIFICATION || ""}</strong></td>
                            <td>${row.AI_COMMENT || ""}</td>
                            <td>${row['WWT PRIORITY'] || ""}</td>
                            <td>${aoaValue}</td>
                            <td>${row['LWV Grade Level_original'] || ""}</td>
                            <td>${row['LWV Pct Correct'] || ""}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });

                if (vMeaningCount === 0) {
                    tbody.innerHTML = `<tr><td colspan="8">No V1 or V2 words found.</td></tr>`;
                } else {
                    // Build the Excel-like dropdown filters once the data is loaded
                    buildDropdownFilters();
                }
            },
            error: function(err) {
                document.getElementById("tableBody").innerHTML = `<tr><td colspan="8">Error loading CSV: ${err.message}</td></tr>`;
            }
        });
    });

    // Function to build Excel-like dropdowns for each column
    function buildDropdownFilters() {
        const table = document.getElementById("dataTable");
        const tbody = document.getElementById("tableBody");
        const rows = Array.from(tbody.getElementsByTagName("tr"));
        const headerRow = table.querySelector("thead tr");
        
        // Create a new row for the dropdown filters
        let filterRow = document.getElementById("filterRow");
        if (!filterRow) {
            filterRow = document.createElement("tr");
            filterRow.id = "filterRow";
            table.querySelector("thead").appendChild(filterRow);
        }
        filterRow.innerHTML = ""; 

        // Loop through each column to create a dropdown
        const colCount = headerRow.cells.length;
        for (let i = 0; i < colCount; i++) {
            const th = document.createElement("th");
            th.style.backgroundColor = "#ecf0f1"; // Slightly lighter background for the filter row
            
            const select = document.createElement("select");
            select.style.width = "100%";
            select.style.padding = "5px";
            select.innerHTML = `<option value="">All</option>`;
            
            // Collect unique values for this specific column
            const uniqueValues = new Set();
            rows.forEach(row => {
                const cell = row.cells[i];
                if (cell) {
                    uniqueValues.add(cell.innerText.trim());
                }
            });

            // Sort and append the unique values to the dropdown
            Array.from(uniqueValues).sort((a, b) => a.localeCompare(b, undefined, {numeric: true})).forEach(val => {
                if (val) {
                    const opt = document.createElement("option");
                    opt.value = val;
                    opt.textContent = val;
                    select.appendChild(opt);
                }
            });

            // Listen for changes on the dropdown to trigger the filter
            select.addEventListener("change", applyAllFilters);
            th.appendChild(select);
            filterRow.appendChild(th);
        }
    }

    // Function to apply both the search bar and the column dropdown filters
    function applyAllFilters() {
        const tbody = document.getElementById("tableBody");
        const rows = Array.from(tbody.getElementsByTagName("tr"));
        const selects = document.querySelectorAll("#filterRow select");
        const globalSearch = document.getElementById("searchInput").value.toLowerCase();

        rows.forEach(row => {
            let showRow = true;
            
            // 1. Check dropdown column filters
            selects.forEach((select, index) => {
                const filterValue = select.value.toLowerCase();
                if (filterValue !== "") {
                    const cellText = row.cells[index]?.innerText.toLowerCase().trim() || "";
                    if (cellText !== filterValue) {
                        showRow = false; // Hide row if it doesn't match the selected dropdown value
                    }
                }
            });

            // 2. Check global search bar filter
            if (showRow && globalSearch !== "") {
                const rowText = row.innerText.toLowerCase();
                if (!rowText.includes(globalSearch)) {
                    showRow = false; // Hide row if it doesn't match the typed search
                }
            }

            // Apply visibility
            row.style.display = showRow ? "" : "none";
        });
    }

    // Connect the global search bar to the new combined filter function
    document.getElementById("searchInput").addEventListener("keyup", applyAllFilters);
</script>
